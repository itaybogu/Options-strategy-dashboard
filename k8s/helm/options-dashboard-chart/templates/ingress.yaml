apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "options-dashboard-chart.fullname" . }}-dashboard-ingress
  labels:
  {{- include "options-dashboard-chart.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: '{{ include "options-dashboard-chart.fullname" . }}-dashboard-service'
            port:
              number: 80
        path: /
        pathType: Prefix