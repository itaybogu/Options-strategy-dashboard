apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "options-dashboard-chart.fullname" . }}-scanner-hpa
  labels:
  {{- include "options-dashboard-chart.labels" . | nindent 4 }}
spec:
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: options-dashboard-deployment