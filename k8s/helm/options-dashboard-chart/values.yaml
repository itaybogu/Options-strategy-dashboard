dashboardDeployment:
  optionsDashboard:
    env:
      environment: production
    image:
      repository: itayb5/options-scanner
      tag: latest
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  replicas: 2
dashboardService:
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
kubernetesClusterDomain: cluster.local
