name: Terraform AWS

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/aws/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/aws/**'
  workflow_dispatch:
    inputs:
      target_cloud:
        description: 'Target Cloud (azure or aws)'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - aws

jobs:
  terraform:
    # Secret Guard + Global Target Cloud Flag
    if: ${{ ( (github.event_name == 'workflow_dispatch' && inputs.target_cloud == 'aws') || (github.event_name != 'workflow_dispatch' && vars.TARGET_CLOUD == 'aws') ) && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform/aws

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan