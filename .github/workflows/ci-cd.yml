name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'        
      - 'Dockerfile'
      - 'requirements.txt'
    paths-ignore:
      - 'README.md'
      - '*.tf'
  workflow_dispatch:
    inputs:
      target_cloud:
        description: 'Target Cloud (azure or aws)'
        required: true
        default: 'azure'
        type: choice
        options:
          - azure
          - aws          

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/app
      DASHBOARD_HTML: ${{ github.workspace }}/app/dashboard.html
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: test_lifecycle.py
        run: python3 tests/test_lifecycle.py

      - name: test_market_cache.py
        if: always()
        run: python3 tests/test_market_cache.py

      - name: test_cache_integration.py
        if: always()
        run: python3 tests/test_cache_integration.py

      - name: test_cache_scope.py
        if: always()
        run: python3 tests/test_cache_scope.py

      - name: test_fundamentals.py
        if: always()
        run: python3 tests/test_fundamentals.py

      - name: test_provider.py
        if: always()
        run: python3 tests/test_provider.py

      - name: test_upsert_state.py
        if: always()
        run: python3 tests/test_upsert_state.py

      - name: test_server_put_selling.py
        if: always()
        run: python3 -m pytest tests/test_server_put_selling.py -q

      - name: test_calendar_payoff.js
        if: always()
        run: node tests/test_calendar_payoff.js

      - name: test_calendar_live.js
        if: always()
        run: node tests/test_calendar_live.js

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/options-scanner:latest

  deploy-azure:
    needs: build-and-push
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_cloud == 'azure') || (github.event_name != 'workflow_dispatch' && vars.TARGET_CLOUD == 'azure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'rg-options-scanner'
          cluster-name: 'aks-options-scanner'

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/options-dashboard-deployment options-dashboard=${{ secrets.DOCKER_USERNAME }}/options-scanner:latest
          kubectl rollout restart deployment options-dashboard-deployment

  deploy-aws:
    needs: build-and-push
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_cloud == 'aws') || (github.event_name != 'workflow_dispatch' && vars.TARGET_CLOUD == 'aws') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name options-scanner-cluster
          kubectl set image deployment/options-dashboard-deployment options-dashboard=${{ secrets.DOCKER_USERNAME }}/options-scanner:latest
          kubectl rollout restart deployment options-dashboard-deployment